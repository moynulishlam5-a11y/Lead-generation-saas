<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Finder</title>
<style>
:root{--bg:#eef2f0;--ink:#12302f;--muted:#5b716f;--line:#cfdad7;--card:#fbfdfc;--accent:#1f6f5c;--accent-ink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c1b;--ink:#e5f0ed;--muted:#93aaa6;--line:#274240;--card:#162726;--accent:#59c3a5;--accent-ink:#06201a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}
main{max-width:920px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch}
form{display:grid;grid-template-columns:2fr 1fr 1.4fr auto;gap:12px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:flex;flex-direction:column;gap:6px;font:600 .85rem system-ui,sans-serif}
input{font:1rem system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:600 1rem system-ui,sans-serif;padding:11px 20px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#status{margin:20px 0 0;font:.95rem system-ui,sans-serif;color:var(--muted)}
#status.error{color:var(--err)}
#results{display:grid;gap:14px;margin-top:20px}
.co{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.co h2{margin:0 0 6px;font-size:1.3rem}
.co p{margin:0 0 12px;white-space:pre-line}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 12px;font:.92rem system-ui,sans-serif}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
a{color:var(--accent)}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{font:.85rem system-ui,sans-serif;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.soc a:hover{border-color:var(--accent)}
@media (max-width:760px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Company Finder</h1>
  <p class="sub">Search by keyword and location. Each result shows the company's email, website, social links and a short summary.</p>

  <form id="f">
    <label>Search query<input name="query" required placeholder="e.g. dental clinic"></label>
    <label>Result limit<input name="limit" type="number" min="1" max="100" value="10" required></label>
    <label>Location<input name="location" required placeholder="e.g. Dhaka"></label>
    <button id="go" type="submit">Find companies</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <section id="results" aria-label="Results"></section>
</main>

<script>
// Paste your n8n webhook URL here. Use the /webhook/ (production) URL once the workflow is active.
var WEBHOOK_URL = "https://n8n-f2ty.srv1670697.hstgr.cloud/webhook-test/7a8570be-3190-4a69-81b3-f6bc6d2dac82";

var form = document.getElementById("f"), go = document.getElementById("go");
var statusEl = document.getElementById("status"), out = document.getElementById("results");

function pick(o, keys){
  for (var i=0;i<keys.length;i++){
    for (var k in o){ if (k.toLowerCase()===keys[i] && o[k]) return o[k]; }
  }
  return "";
}
function safeUrl(u){
  if (typeof u!=="string") return "";
  u=u.trim(); if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u="https://"+u;
  try{ var p=new URL(u); return /^https?:$/.test(p.protocol)?p.href:""; }catch(e){ return ""; }
}
function socials(o){
  var list=[], seen={};
  function add(name,url){ var s=safeUrl(url); if(s && !seen[s]){ seen[s]=1; list.push([name,s]); } }
  var s=pick(o,["socials","social_links","sociallinks","social_media","socialmedia","social"]);
  if (Array.isArray(s)) s.forEach(function(x){
    if (typeof x==="string") add(host(x),x); else if (x&&typeof x==="object") add(x.name||x.platform||host(x.url||x.link),x.url||x.link);
  });
  else if (s && typeof s==="object") for (var k in s) add(k,s[k]);
  else if (typeof s==="string") s.split(/[\s,]+/).forEach(function(x){ add(host(x),x); });
  ["facebook","linkedin","twitter","x","instagram","youtube","tiktok","github"].forEach(function(n){ if(o[n]) add(n,o[n]); });
  return list;
}
function host(u){ try{ return new URL(safeUrl(u)).hostname.replace(/^www\./,"").split(".")[0]; }catch(e){ return "link"; } }

function row(dl,label,value,href){
  if(!value) return;
  var dt=document.createElement("dt"), dd=document.createElement("dd");
  dt.textContent=label;
  if(href){ var a=document.createElement("a"); a.href=href; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=value; dd.appendChild(a); }
  else dd.textContent=value;
  dl.appendChild(dt); dl.appendChild(dd);
}
function card(o){
  var c=document.createElement("article"); c.className="co";
  var h=document.createElement("h2"); h.textContent=String(pick(o,["company","company_name","companyname","name","title"])||"Unnamed company"); c.appendChild(h);
  var sum=pick(o,["summary","short_summary","description","about"]);
  if(sum){ var p=document.createElement("p"); p.textContent=String(sum); c.appendChild(p); }
  var dl=document.createElement("dl");
  var email=pick(o,["email","gmail","email_address","emails"]); if(Array.isArray(email)) email=email.join(", ");
  var web=pick(o,["website","url","site","web"]);
  var addr=pick(o,["location","address"]); var phone=pick(o,["phone","telephone"]);
  row(dl,"Email",String(email),email&&String(email).indexOf("@")>0&&String(email).indexOf(",")<0?"mailto:"+email:"");
  row(dl,"Website",String(web),safeUrl(String(web)));
  row(dl,"Phone",String(phone)); row(dl,"Address",typeof addr==="string"?addr:"");
  if(dl.children.length) c.appendChild(dl);
  var s=socials(o);
  if(s.length){
    var w=document.createElement("div"); w.className="soc";
    s.forEach(function(x){ var a=document.createElement("a"); a.href=x[1]; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=x[0]; w.appendChild(a); });
    c.appendChild(w);
  }
  return c;
}
function toList(d){
  if(typeof d==="string"){ try{ d=JSON.parse(d); }catch(e){ return []; } }
  if(Array.isArray(d)) return d.reduce(function(a,x){ return a.concat(toList(x)); },[]);
  if(d && typeof d==="object"){
    for (var k of ["results","companies","data","items","output"]) if(d[k]) return toList(d[k]);
    return [d];
  }
  return [];
}

form.addEventListener("submit", function(e){
  e.preventDefault();
  var fd=new FormData(form);
  var payload={ query:fd.get("query").trim(), limit:Number(fd.get("limit")), location:fd.get("location").trim() };
  go.disabled=true; out.textContent=""; statusEl.className=""; statusEl.textContent="Searching… this can take a while.";
  fetch(WEBHOOK_URL,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) })
    .then(function(r){ if(!r.ok) throw new Error("Server replied "+r.status+(r.status===404?" — click 'Listen for test event' in n8n first, or use the production URL.":"")); return r.text(); })
    .then(function(t){
      var list=toList(t);
      if(!list.length){ statusEl.textContent="No results returned."; return; }
      list.forEach(function(o){ if(o&&typeof o==="object") out.appendChild(card(o)); });
      statusEl.textContent=out.children.length+" result"+(out.children.length===1?"":"s")+" found.";
    })
    .catch(function(err){
      statusEl.className="error";
      statusEl.textContent="Request failed: "+err.message+(err instanceof TypeError?" (Likely a CORS block: set 'Allowed Origins' to * on the n8n Webhook node.)":"");
    })
    .finally(function(){ go.disabled=false; });
});
</script>
</body>
</html>
